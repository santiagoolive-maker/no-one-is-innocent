<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2350" viewBox="0 0 1400 2350" role="img" aria-labelledby="title desc">
<title id="title">Propuesta de pantallas y HUD para No One Is Innocent</title>
<desc id="desc">Cinco mockups: inicio, escena narrativa, decision con HUD, resultado y final.</desc>
<style>
.screen{fill:#16202A;stroke:#324A5F;stroke-width:4}.panel{fill:#263847;stroke:#324A5F;stroke-width:2}.card{fill:#324A5F}.gold{fill:#C99B3B}.red{fill:#8C2F39}.white{fill:#F6F8FA;font-family:Arial,sans-serif}.muted{fill:#B8C4CE;font-family:Arial,sans-serif}.label{fill:#C99B3B;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;letter-spacing:1px}.heading{fill:#F6F8FA;font-family:Arial,sans-serif;font-size:27px;font-weight:bold}.body{fill:#B8C4CE;font-family:Arial,sans-serif;font-size:18px}.small{fill:#B8C4CE;font-family:Arial,sans-serif;font-size:14px}.button{fill:#C99B3B}.buttonText{fill:#16202A;font-family:Arial,sans-serif;font-size:18px;font-weight:bold}.var{fill:#F6F8FA;font-family:Arial,sans-serif;font-size:13px;font-weight:bold}
</style>
<rect width="1400" height="2350" fill="#0D141B"/>
<text x="70" y="70" class="white" font-size="34" font-weight="bold">NO ONE IS INNOCENT</text>
<text x="70" y="102" class="muted" font-size="18">Propuesta de pantallas y HUD - reemplazar los bloques de imagen por recursos propios</text>

<!-- Inicio -->
<text x="70" y="170" class="label">01 / INICIO</text>
<rect x="70" y="195" width="1260" height="350" rx="10" class="screen"/>
<rect x="98" y="225" width="1210" height="290" rx="8" class="panel"/>
<rect x="808" y="225" width="500" height="290" class="card"/>
<text x="932" y="362" class="muted" font-size="21">FONDO PROPIO</text>
<text x="185" y="306" class="label">ZENITH CLASSIFIED</text>
<text x="185" y="360" class="white" font-size="44" font-weight="bold">NO ONE IS INNOCENT</text>
<text x="185" y="398" class="body">Thriller interactivo de decisiones</text>
<rect x="185" y="430" width="210" height="50" rx="5" class="button"/>
<text x="218" y="462" class="buttonText">NUEVA PARTIDA</text>
<text x="422" y="462" class="muted" font-size="17">Como jugar</text>

<!-- Escena -->
<text x="70" y="625" class="label">02 / ESCENA NARRATIVA</text>
<rect x="70" y="650" width="1260" height="350" rx="10" class="screen"/>
<rect x="98" y="680" width="1210" height="222" class="panel"/>
<text x="130" y="718" class="label">ACTO I / EL CONTRATO</text>
<rect x="980" y="704" width="288" height="168" class="card"/>
<text x="1040" y="792" class="muted" font-size="17">FONDO PROPIO</text>
<text x="130" y="770" class="heading">El primer mensaje llega antes del amanecer.</text>
<text x="130" y="808" class="body">Veyra dice que es una amenaza menor, pero Klark reconoce un simbolo de BLACK VEIL.</text>
<text x="130" y="840" class="body">El jugador lee, observa la escena y continua.</text>
<rect x="1080" y="925" width="188" height="46" rx="5" class="button"/>
<text x="1123" y="955" class="buttonText">CONTINUAR</text>

<!-- Decision -->
<text x="70" y="1080" class="label">03 / DECISION Y HUD</text>
<rect x="70" y="1105" width="1260" height="510" rx="10" class="screen"/>
<text x="102" y="1142" class="white" font-size="20" font-weight="bold">NO ONE IS INNOCENT</text>
<text x="1180" y="1142" class="muted" font-size="16">ESTADO</text>
<text x="102" y="1180" class="small">CONFIANZA 5/10</text><rect x="102" y="1191" width="160" height="10" fill="#1B2731"/><rect x="102" y="1191" width="80" height="10" class="gold"/>
<text x="292" y="1180" class="small">MORALIDAD 5/10</text><rect x="292" y="1191" width="160" height="10" fill="#1B2731"/><rect x="292" y="1191" width="80" height="10" class="gold"/>
<text x="482" y="1180" class="small">INVESTIGACION 5/10</text><rect x="482" y="1191" width="160" height="10" fill="#1B2731"/><rect x="482" y="1191" width="80" height="10" class="gold"/>
<text x="672" y="1180" class="small">LEALTAD 5/10</text><rect x="672" y="1191" width="160" height="10" fill="#1B2731"/><rect x="672" y="1191" width="80" height="10" class="gold"/>
<text x="862" y="1180" class="small">CORRUPCION 0/10</text><rect x="862" y="1191" width="160" height="10" fill="#1B2731"/><rect x="862" y="1191" width="8" height="10" class="red"/>
<rect x="102" y="1232" width="430" height="320" class="card"/>
<text x="200" y="1398" class="muted" font-size="19">PERSONAJE O FONDO PROPIO</text>
<text x="566" y="1272" class="label">DECISION 03 / ZENITH</text>
<text x="566" y="1320" class="heading">¿Que hace Klark con la informacion?</text>
<text x="566" y="1356" class="body">Una foto y transferencias vinculan a Veyra con ZENITH.</text>
<rect x="566" y="1392" width="660" height="43" rx="5" class="card"/><text x="592" y="1420" class="white" font-size="18">A  Confrontar a Veyra</text>
<rect x="566" y="1450" width="660" height="43" rx="5" class="card"/><text x="592" y="1478" class="white" font-size="18">B  Investigar en secreto</text>
<rect x="566" y="1508" width="660" height="43" rx="5" class="card"/><text x="592" y="1536" class="white" font-size="18">C  Ignorar y protegerlo</text>

<!-- Resultado -->
<text x="70" y="1695" class="label">04 / RESULTADO DE DECISION</text>
<rect x="70" y="1720" width="1260" height="260" rx="10" class="screen"/>
<text x="115" y="1770" class="label">DECISION REGISTRADA</text>
<text x="115" y="1813" class="heading">Klark conserva la foto y evita que Veyra la destruya.</text>
<text x="115" y="1848" class="body">Conseguio una pista sobre ZENITH, pero Veyra empieza a desconfiar.</text>
<rect x="115" y="1880" width="210" height="48" rx="5" class="card"/><text x="138" y="1910" class="white" font-size="16">INVESTIGACION +2</text>
<rect x="345" y="1880" width="190" height="48" rx="5" class="red"/><text x="368" y="1910" class="white" font-size="16">CONFIANZA -1</text>
<rect x="1030" y="1880" width="220" height="48" rx="5" class="button"/><text x="1068" y="1910" class="buttonText">CONTINUAR</text>

<!-- Final -->
<text x="70" y="2060" class="label">05 / FINAL</text>
<rect x="70" y="2085" width="1260" height="220" rx="10" class="screen"/>
<rect x="100" y="2115" width="310" height="160" class="card"/><text x="154" y="2200" class="muted" font-size="17">ILUSTRACION PROPIA</text>
<text x="455" y="2148" class="label">INFORME FINAL</text>
<text x="455" y="2190" class="heading">LA VERDAD</text>
<text x="455" y="2224" class="body">Klark entrega las pruebas. Veyra cae, pero ZENITH sigue activa.</text>
<text x="455" y="2255" class="muted" font-size="16">[ Ver estado final ]   [ Jugar de nuevo ]</text>
</svg>
