<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080e16">
    <title>No One Is Innocent</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="historia.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <main id="juego" aria-label="No One Is Innocent">
        <header id="cabecera" hidden>
            <a class="marca" href="#" id="marca" aria-label="Volver al menú">NO ONE <span>IS INNOCENT</span></a>
            <nav aria-label="Controles de partida">
                <button id="menu" type="button">Menú <kbd>Esc</kbd></button>
                <button id="variables" type="button">Variables <kbd>V</kbd></button>
                <button id="movimiento" type="button" aria-pressed="true">Animación: sí</button>
            </nav>
        </header>
        <section id="pantalla" aria-label="Escena del juego" class="portada">
            <div id="ilustracion">
                <canvas id="imagen-escena" width="1536" height="1024" role="img" aria-label="Ilustración del juego">
                    Tu navegador necesita admitir canvas para mostrar las escenas.
                </canvas>
                <p id="pie-ilustracion" hidden></p>
            </div>
            <div id="zonas"></div>
            <article id="narrativa" hidden tabindex="-1" aria-labelledby="titulo-escena"></article>
        </section>
        <footer id="ayuda" hidden>Seis decisiones. Tres finales. Cada elección deja una huella.</footer>
        <p id="descripcion-escena" class="solo-lectores" aria-live="polite"></p>
        <div id="carga" role="status"><p>Cargando escenas…</p></div>
        <noscript>Activá JavaScript para jugar.</noscript>
    </main>
</body>
</html>
